<script>
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ── Arrow SVG ─────────────────────────────────────────────────────────────────
function arrowSVG(dir,s){
  const c=s/2,m=Math.ceil(s*0.12),e=s-m,sw=Math.max(1.6,s/12),ahLarge=s*0.34,ahSmall=s*0.25;
  function head(x,y,dx,dy,size='large'){const ah=size==='small'?ahSmall:ahLarge;const l=Math.sqrt(dx*dx+dy*dy),nx=dx/l,ny=dy/l,px=-ny,py=nx;return`M${x-nx*ah+px*ah*0.45},${y-ny*ah+py*ah*0.45} L${x},${y} L${x-nx*ah-px*ah*0.45},${y-ny*ah-py*ah*0.45}`;}
  const paths={right:[`M${m},${c} L${e},${c}`,head(e,c,1,0,'large')],left:[`M${e},${c} L${m},${c}`,head(m,c,-1,0,'large')],down:[`M${c},${m} L${c},${e}`,head(c,e,0,1,'large')],up:[`M${c},${e} L${c},${m}`,head(c,m,0,-1,'large')],'right-down':[`M${m},${c} L${c},${c} L${c},${1.2*e-0.2*c}`,head(c,1.2*e-0.2*c,0,1,'small')],'down-right':[`M${c},${m} L${c},${c} L${1.2*e-0.2*c},${c}`,head(1.2*e-0.2*c,c,1,0,'small')],'left-down':[`M${e},${c} L${c},${c} L${c},${1.2*e-0.2*c}`,head(c,1.2*e-0.2*c,0,1,'small')],'down-left':[`M${c},${m} L${c},${c} L${1.2*m-0.2*c},${c}`,head(1.2*m-0.2*c,c,-1,0,'small')],'right-up':[`M${m},${c} L${c},${c} L${c},${1.2*m-0.2*c}`,head(c,1.2*m-0.2*c,0,-1,'small')],'up-right':[`M${c},${e} L${c},${c} L${1.2*e-0.2*c},${c}`,head(1.2*e-0.2*c,c,1,0,'small')],'left-up':[`M${e},${c} L${c},${c} L${c},${1.2*m-0.2*c}`,head(c,1.2*m-0.2*c,0,-1,'small')],'up-left':[`M${c},${e} L${c},${c} L${1.2*m-0.2*c},${c}`,head(1.2*m-0.2*c,c,-1,0,'small')]};
  const[p,a]=paths[dir]||paths.right;
  return`<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" xmlns="http://www.w3.org/2000/svg"><path d="${p}" stroke="#7744bb" stroke-width="${sw}" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="${a}" stroke="#7744bb" stroke-width="${sw}" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function answerArrowSVG(dir,s){
  const thinStroke=Math.max(1,s/16);
  return arrowSVG(dir,s).replace(/stroke-width="[^"]+"/g,`stroke-width="${thinStroke}"`);
}
const EAPOS={right:'right',left:'left',down:'bottom',up:'top','right-down':'right','down-right':'bottom','left-down':'left','down-left':'bottom','right-up':'right','up-right':'top','left-up':'left','up-left':'top'};
function eAPC(dir,isMulti){let p=EAPOS[dir]||'right';if(isMulti&&(p==='top'||p==='bottom'))p='right';if(p==='left')return'ap-left';if(p==='bottom')return'ap-bottom';if(p==='top')return'ap-top';return'ap-right';}
function getWordCells(dir,ans,or,oc){
  const len=ans.length,cells=[];
  if(dir==='right'){for(let i=0;i<len;i++)cells.push([or,oc+1+i]);}
  else if(dir==='left'){for(let i=0;i<len;i++)cells.push([or,oc-len+i]);}
  else if(dir==='down'){for(let i=0;i<len;i++)cells.push([or+1+i,oc]);}
  else if(dir==='up'){for(let i=0;i<len;i++)cells.push([or-len+i,oc]);}
  else if(dir==='right-down'){cells.push([or,oc+1]);for(let i=1;i<len;i++)cells.push([or+i,oc+1]);}
  else if(dir==='down-right'){cells.push([or+1,oc]);for(let i=1;i<len;i++)cells.push([or+1,oc+i]);}
  else if(dir==='left-down'){cells.push([or,oc-1]);for(let i=1;i<len;i++)cells.push([or+i,oc-1]);}
  else if(dir==='down-left'){const t=[[or+1,oc]];for(let i=1;i<len;i++)t.push([or+1,oc-i]);t.sort((a,b)=>a[1]-b[1]);cells.push(...t);}
  else if(dir==='right-up'){const t=[[or,oc+1]];for(let i=1;i<len;i++)t.push([or-i,oc+1]);t.sort((a,b)=>a[0]-b[0]);cells.push(...t);}
  else if(dir==='up-right'){const t=[[or-1,oc]];for(let i=1;i<len;i++)t.push([or-1,oc+i]);cells.push(...t);}
  else if(dir==='left-up'){const t=[[or,oc-1]];for(let i=1;i<len;i++)t.push([or-i,oc-1]);t.sort((a,b)=>a[0]-b[0]);cells.push(...t);}
  else if(dir==='up-left'){const t=[[or-1,oc]];for(let i=1;i<len;i++)t.push([or-1,oc-i]);t.sort((a,b)=>a[1]-b[1]);cells.push(...t);}
  return cells;
}

function firstAnswerTarget(dir,or,oc){
  const steps={
    right:[0,1,'left'],left:[0,-1,'right'],down:[1,0,'top'],up:[-1,0,'bottom'],
    'right-down':[0,1,'left'],'down-right':[1,0,'top'],
    'left-down':[0,-1,'right'],'down-left':[1,0,'top'],
    'right-up':[0,1,'left'],'up-right':[-1,0,'bottom'],
    'left-up':[0,-1,'right'],'up-left':[-1,0,'bottom']
  };
  const [dr,dc,edge]=steps[dir]||steps.right;
  return {r:or+dr,c:oc+dc,edge};
}

function clueBoxWeight(cl){
  const length=Math.max(1,String(cl&&cl.clue||'?').trim().length);
  return Math.sqrt(length);
}

function getAnswerArrowMarkers(r,c,grid,baseTextPx){
  const markers=[];
  for(let or=0;or<grid.length;or++){
    for(let oc=0;oc<(grid[or]||[]).length;oc++){
      const owner=grid[or][oc];
      if(owner.t!=='clue'||!Array.isArray(owner.clues)||!owner.clues.length)continue;
      const weights=owner.clues.map(clueBoxWeight);
      const total=weights.reduce((sum,value)=>sum+value,0)||owner.clues.length;
      let consumed=0;
      owner.clues.forEach((cl,index)=>{
        const weight=weights[index]||1;
        const target=firstAnswerTarget(cl.dir,or,oc);
    if(target.r===r&&target.c===c){
      // Up/down arrows sit on horizontal cell edges, so center them across
      // the destination cell. Only left/right arrows follow the clue's
      // vertical share within a split clue box.
      const position=(target.edge==='top'||target.edge==='bottom')
        ?50
        :((consumed+weight/2)/total)*100;
      markers.push({dir:cl.dir,edge:target.edge,position});
        }
        consumed+=weight;
      });
    }
  }
  return markers;
}

function appendAnswerArrowMarkers(td,r,c,grid,cellPx,baseTextPx){
  const markerSize=Math.max(8,Math.round(cellPx*0.25));
  getAnswerArrowMarkers(r,c,grid,baseTextPx).forEach(marker=>{
    const el=document.createElement('span');
    el.className='answer-arrow-marker edge-'+marker.edge;
    el.style.setProperty('--arrow-size',markerSize+'px');
    el.style.setProperty('--slot-position',marker.position+'%');
    el.innerHTML=answerArrowSVG(marker.dir,markerSize);
    td.appendChild(el);
  });
}

// ── Solver grid ───────────────────────────────────────────────────────────────
let sWords = [], sActive = null, sCurZoom = 1;
let sPrintGrid = null, sPrintRows = 0, sPrintCols = 0, sPrintCellSizePx = 64, sPrintTextSizePx = 12;

function gridWrapClick(e) {
  if (e.target.closest('td.t-empty') || e.target.closest('td.t-black') || e.target === document.getElementById('s-grid-wrap') || e.target === document.getElementById('s-zoom-wrap')) {
    sActive = null; sHighlight();
  }
}

function forceResetHighlights(){
  document.querySelectorAll('#s-grid input').forEach(inp => { inp.style.background = ''; });
  document.querySelectorAll('.clue-slot.active-clue').forEach(e => e.classList.remove('active-clue'));
  sActive = null;
}

function buildSolverGrid(data) {
  const rows=data.rows,cols=data.cols,cSz=data.cellSizePx||64,tSz=data.textSizePx||12;
  const arSz=Math.max(10,Math.round(cSz*0.24));
  sWords=[];sActive=null;
  const G2=[];
  for(let r=0;r<rows;r++){G2.push([]);for(let c=0;c<cols;c++)G2[r].push({t:'empty',clues:[],answerOf:null});}
  data.cells.forEach(cell=>{
    if(cell.t==='black'){G2[cell.r][cell.c].t='black';}
    else if(cell.t==='clue'){
      G2[cell.r][cell.c]={t:'clue',clues:cell.clues.map(cl=>({...cl})),answerOf:null};
      cell.clues.forEach((cl,ci)=>{
        const wcells=getWordCells(cl.dir,cl.ans,cell.r,cell.c).filter(([ar,ac])=>ar>=0&&ar<rows&&ac>=0&&ac<cols);
        sWords.push({or:cell.r,oc:cell.c,ci,cells:wcells,ans:cl.ans});
        wcells.forEach(([ar,ac],i)=>{if(G2[ar][ac].t==='answer')G2[ar][ac].letter2=cl.ans[i];else G2[ar][ac]={t:'answer',clues:[],answerOf:{letter:cl.ans[i]}};});
      });
    }
  });
  sPrintGrid=G2;sPrintRows=rows;sPrintCols=cols;sPrintCellSizePx=cSz;sPrintTextSizePx=tSz;
  const sz=`width:${cSz}px;height:${cSz}px;min-width:${cSz}px;min-height:${cSz}px;max-width:${cSz}px;max-height:${cSz}px`;
  const tbl=document.getElementById('s-grid');tbl.innerHTML='';
  for(let r=0;r<rows;r++){
    const tr=document.createElement('tr');
    for(let c=0;c<cols;c++){
      const cell=G2[r][c],td=document.createElement('td');td.setAttribute('style',sz);
      if(cell.t==='black'){td.className='t-black';}
      else if(cell.t==='clue'){
        td.className='t-clue';
        const inner=document.createElement('div');inner.className='clue-inner';
        cell.clues.forEach((cl,idx)=>{
          if(idx>0){const dv=document.createElement('div');dv.className='clue-divider';inner.appendChild(dv);}
          const slot=document.createElement('div');slot.className='clue-slot';
          slot.dataset.or=r;slot.dataset.oc=c;slot.dataset.ci=idx;
          const fs=cl.textSize&&cl.textSize>0?cl.textSize:tSz;
          slot.style.flex=clueBoxWeight(cl)+' 1 0';
          slot.innerHTML=`<div class="slot-text" style="font-size:${fs}px">${escHtml(cl.clue||'?')}</div>`;
          slot.addEventListener('click',e=>{e.stopPropagation();sPickClue(+slot.dataset.or,+slot.dataset.oc,+slot.dataset.ci);});
          inner.appendChild(slot);
        });
        td.appendChild(inner);
      }else if(cell.t==='answer'){
        td.className='t-answer';
        const inp=document.createElement('input');inp.className='solve-input';inp.type='text';inp.maxLength=1;
        inp.dataset.r=r;inp.dataset.c=c;inp.style.fontSize=Math.round(cSz*0.38)+'px';
        inp.setAttribute('autocapitalize','characters');inp.setAttribute('autocomplete','off');inp.setAttribute('autocorrect','off');inp.setAttribute('spellcheck','false');
        inp.addEventListener('input',e=>{startTimer();sSolveInput(e);});inp.addEventListener('keydown',sSolveKeydown);inp.addEventListener('focus',e=>{startTimer();sSolveFocus(e);});
        td.appendChild(inp);
        appendAnswerArrowMarkers(td,r,c,G2,cSz,tSz);
      }else{td.className='t-empty';}
      tr.appendChild(td);
    }
    tbl.appendChild(tr);
  }
}

function getRenderedSolverClueLayout(r,c,index){
  const slot=document.querySelector(
    '#s-grid .clue-slot[data-or="'+r+'"][data-oc="'+c+'"][data-ci="'+index+'"]'
  );
  const text=slot&&slot.querySelector('.slot-text');
  if(!text||!text.clientWidth||!text.clientHeight)return null;
  const node=text.firstChild;
  const lines=[];
  if(node&&node.nodeType===Node.TEXT_NODE&&node.data.length){
    let line='',lastTop=null;
    for(let i=0;i<node.data.length;i++){
      const range=document.createRange();
      range.setStart(node,i);
      range.setEnd(node,i+1);
      const rect=range.getBoundingClientRect();
      if(rect.height>0&&lastTop!==null&&Math.abs(rect.top-lastTop)>1.5){
        lines.push(line.trim());
        line='';
        lastTop=rect.top;
      }else if(rect.height>0&&lastTop===null){
        lastTop=rect.top;
      }
      line+=node.data[i];
    }
    if(line.length)lines.push(line.trim());
  }
  return{
    fontSize:parseFloat(getComputedStyle(text).fontSize)||0,
    width:text.clientWidth,
    height:text.clientHeight,
    lines:lines.filter(Boolean)
  };
}

function printSolverPuzzle(){
  if(!sPrintGrid||!sPrintGrid.length||!sPrintRows||!sPrintCols){alert('There is no puzzle grid to print yet.');return;}
  fitSolverText();

  const pages=document.getElementById('solver-print-pages')||document.body.appendChild(document.createElement('div'));
  pages.id='solver-print-pages';
  pages.replaceChildren();
  const pageName=(document.getElementById('solver-title').textContent||'').trim()||'Untitled puzzle';
  const availableWidth=(210-24)/25.4*96;
  const availableHeight=(297-24-18)/25.4*96;
  const printCellSize=Math.min(84,availableWidth/sPrintCols,availableHeight/sPrintRows);
  const scale=printCellSize/sPrintCellSizePx;
  const svgNS='http://www.w3.org/2000/svg';
  const htmlNS='http://www.w3.org/1999/xhtml';

  function svgNode(name,attrs){
    const node=document.createElementNS(svgNS,name);
    Object.keys(attrs||{}).forEach(key=>node.setAttribute(key,attrs[key]));
    return node;
  }

  function buildPrintGrid(showAnswers){
    const width=sPrintCols*printCellSize,height=sPrintRows*printCellSize;
    const svg=svgNode('svg',{
      class:'print-svg',xmlns:svgNS,
      width:width+'px',height:height+'px',
      viewBox:'0 0 '+width+' '+height,
      role:'img','aria-label':showAnswers?'Puzzle answer grid':'Blank puzzle grid'
    });
    svg.style.width=width+'px';
    svg.style.height=height+'px';
    svg.style.printColorAdjust='exact';
    svg.style.webkitPrintColorAdjust='exact';

    for(let r=0;r<sPrintRows;r++){
      for(let c=0;c<sPrintCols;c++){
        const cell=sPrintGrid[r][c]||{t:'empty'};
        const x=c*printCellSize,y=r*printCellSize;
        const fill=cell.t==='black'?'#222':cell.t==='clue'?'#eee9f2':'#fff';
        svg.appendChild(svgNode('rect',{
          x:x,y:y,width:printCellSize,height:printCellSize,fill:fill
        }));

        if(cell.t==='answer'&&showAnswers&&cell.answerOf&&cell.answerOf.letter){
          const letter=svgNode('text',{
            x:x+printCellSize/2,y:y+printCellSize/2,
            'text-anchor':'middle','dominant-baseline':'central',
            'font-family':'Arial, sans-serif','font-size':Math.round(sPrintCellSizePx*.38)*scale,
            'font-weight':'600',fill:'#111'
          });
          letter.textContent=cell.answerOf.letter;
          svg.appendChild(letter);
        }

        if(cell.t==='answer'){
          const markerSize=Math.max(6,printCellSize*0.25);
          getAnswerArrowMarkers(r,c,sPrintGrid,sPrintTextSizePx).forEach(marker=>{
            let markerX=x+printCellSize/2-markerSize/2;
            let markerY=y+printCellSize/2-markerSize/2;
            if(marker.edge==='left'){
              markerX=x+1.5*scale;
              markerY=y+printCellSize*marker.position/100-markerSize/2;
            }else if(marker.edge==='right'){
              markerX=x+printCellSize-markerSize-1.5*scale;
              markerY=y+printCellSize*marker.position/100-markerSize/2;
            }else if(marker.edge==='top'){
              markerX=x+printCellSize*marker.position/100-markerSize/2;
              markerY=y+1.5*scale;
            }else{
              markerX=x+printCellSize*marker.position/100-markerSize/2;
              markerY=y+printCellSize-markerSize-1.5*scale;
            }
            const parsed=new DOMParser().parseFromString(
              answerArrowSVG(marker.dir,markerSize),
              'image/svg+xml'
            );
            const markerSvg=document.importNode(parsed.documentElement,true);
            markerSvg.setAttribute('x',markerX);
            markerSvg.setAttribute('y',markerY);
            markerSvg.setAttribute('width',markerSize);
            markerSvg.setAttribute('height',markerSize);
            svg.appendChild(markerSvg);
          });
        }

        if(cell.t==='clue'&&Array.isArray(cell.clues)&&cell.clues.length){
          const clues=cell.clues;
          const gap=clues.length>1?0.6:0;
          const usableHeight=printCellSize-gap*(clues.length-1);
          const sizes=clues.map(cl=>cl.textSize&&cl.textSize>0?cl.textSize:sPrintTextSizePx);
          const weights=clues.map(clueBoxWeight);
          const totalWeight=weights.reduce((sum,weight)=>sum+weight,0)||clues.length;
          let slotY=y;
          clues.forEach((cl,index)=>{
            const slotHeight=usableHeight*(weights[index]/totalWeight);
            if(index>0){
              svg.appendChild(svgNode('line',{
                x1:x+2,y1:slotY+gap/2,x2:x+printCellSize-2,y2:slotY+gap/2,
                stroke:'#9966cc','stroke-width':'0.7'
              }));
              slotY+=gap;
            }

            const inset=1;
            const fo=svgNode('foreignObject',{
              x:x+inset,y:slotY+inset,
              width:Math.max(1,printCellSize-inset*2),
              height:Math.max(1,slotHeight-inset*2)
            });
            const slot=document.createElementNS(htmlNS,'div');
            slot.style.cssText='width:100%;height:100%;box-sizing:border-box;display:flex;overflow:hidden;padding:1px 2px;align-items:center;justify-content:center;';

            const text=document.createElementNS(htmlNS,'div');
            const screenLayout=getRenderedSolverClueLayout(r,c,index);
            text.textContent=screenLayout&&screenLayout.lines.length
              ?screenLayout.lines.join('\n')
              :(cl.clue||'?');
            text.style.cssText='font-family:Arial,sans-serif;font-weight:600;color:#222;line-height:1.15;text-align:center;overflow:hidden;overflow-wrap:normal;word-break:normal;hyphens:none;min-width:0;min-height:0;width:100%;flex:1 1 auto;';
            if(screenLayout&&screenLayout.lines.length>1)text.style.whiteSpace='pre-line';
            const printTextScale=screenLayout
              ?Math.min(
                  Math.max(1,printCellSize-inset*2-4)/screenLayout.width,
                  Math.max(1,slotHeight-inset*2-2)/screenLayout.height
                )
              :scale;
            text.style.fontSize=((screenLayout&&screenLayout.fontSize||sizes[index])*printTextScale)+'px';
            slot.appendChild(text);
            fo.appendChild(slot);
            svg.appendChild(fo);
            slotY+=slotHeight;
          });
        }
      }
    }

    // Draw every grid boundary once, above the cell contents, just like the
    // builder's print grid. SVG strokes avoid missing or collapsed borders.
    const lineWidth=1.1;
    for(let c=0;c<=sPrintCols;c++){
      const x=c===0?lineWidth/2:c===sPrintCols?width-lineWidth/2:c*printCellSize;
      svg.appendChild(svgNode('line',{
        x1:x,y1:0,x2:x,y2:height,stroke:'#222',
        'stroke-width':lineWidth,'shape-rendering':'crispEdges'
      }));
    }
    for(let r=0;r<=sPrintRows;r++){
      const y=r===0?lineWidth/2:r===sPrintRows?height-lineWidth/2:r*printCellSize;
      svg.appendChild(svgNode('line',{
        x1:0,y1:y,x2:width,y2:y,stroke:'#222',
        'stroke-width':lineWidth,'shape-rendering':'crispEdges'
      }));
    }
    return svg;
  }

  function addPrintPage(showAnswers){
    const page=document.createElement('section');
    page.className='print-page';
    const heading=document.createElement('h1');
    heading.className='print-title';
    heading.textContent=pageName;
    const gridArea=document.createElement('div');
    gridArea.className='print-grid-area';
    gridArea.appendChild(buildPrintGrid(showAnswers));
    page.append(heading,gridArea);
    pages.appendChild(page);
  }

  // Match the builder's blank-puzzle page, without its separate answer page.
  addPrintPage(false);
  document.body.classList.add('solver-printing');
  window.addEventListener('afterprint',function cleanupPrint(){
    document.body.classList.remove('solver-printing');
    pages.replaceChildren();
    window.removeEventListener('afterprint',cleanupPrint);
  },{once:true});
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      window.print();
    });
  });
}

function fitSolverText(){document.querySelectorAll('#s-grid .clue-slot').forEach(slot=>{const t=slot.querySelector('.slot-text');if(!t)return;let fs=parseFloat(t.style.fontSize)||10,s=40;while(s-->0&&fs>4&&(slot.scrollWidth>slot.clientWidth+1||slot.scrollHeight>slot.clientHeight+1)){fs-=0.5;t.style.fontSize=fs+'px';}});}
function sGetInp(r,c){return document.querySelector('#s-grid input.solve-input[data-r="'+r+'"][data-c="'+c+'"]');}
function sPickClue(or,oc,ci){const w=sWords.find(x=>x.or===or&&x.oc===oc&&x.ci===ci);if(!w)return;sActive={or,oc,ci,cells:w.cells,ans:w.ans,idx:0};sHighlight();const inp=sGetInp(w.cells[0][0],w.cells[0][1]);if(inp){inp.focus();inp.select();}}
function sHighlight(){
  document.querySelectorAll('#s-grid .solve-input').forEach(i=>i.classList.remove('in-active-word','active-cell'));
  document.querySelectorAll('#s-grid .clue-slot').forEach(s=>s.classList.remove('active-clue'));
  if(!sActive)return;
  sActive.cells.forEach(([r,c],i)=>{const inp=sGetInp(r,c);if(inp){inp.classList.add('in-active-word');if(i===sActive.idx)inp.classList.add('active-cell');}});
  const slot=document.querySelector('#s-grid .clue-slot[data-or="'+sActive.or+'"][data-oc="'+sActive.oc+'"][data-ci="'+sActive.ci+'"]');
  if(slot)slot.classList.add('active-clue');
}
function sSolveFocus(e){
  const inp=e.target;inp.classList.remove('wrong');
  const r=+inp.dataset.r,c=+inp.dataset.c;
  if(sActive){const i=sActive.cells.findIndex(([a,b])=>a===r&&b===c);if(i>=0){sActive.idx=i;sHighlight();return;}}
  const w=sWords.find(x=>x.cells.some(([a,b])=>a===r&&b===c));
  if(w){sActive={or:w.or,oc:w.oc,ci:w.ci,cells:w.cells,ans:w.ans,idx:w.cells.findIndex(([a,b])=>a===r&&b===c)};if(sActive.idx<0)sActive.idx=0;sHighlight();}
}
function sSolveInput(e){
  const inp=e.target;inp.value=(inp.value||'').slice(-1).toUpperCase().replace(/[^A-Z]/,'');inp.classList.remove('wrong');
  if(inp.value&&sActive){const next=sActive.idx+1;if(next<sActive.cells.length){sActive.idx=next;const[nr,nc]=sActive.cells[next];const ni=sGetInp(nr,nc);if(ni){ni.focus();ni.select();}}else sHighlight();}
  sMaybeCelebrate();
}
function sSolveKeydown(e){
  const inp=e.target;
  if(e.key==='Backspace'){if(inp.value)return;if(sActive&&sActive.idx>0){e.preventDefault();sActive.idx--;const[pr,pc]=sActive.cells[sActive.idx];const pi=sGetInp(pr,pc);if(pi){pi.value='';pi.classList.remove('wrong');pi.focus();pi.select();}}}
  else if(e.key==='ArrowRight'||e.key==='ArrowDown'){if(sActive&&sActive.idx<sActive.cells.length-1){e.preventDefault();sActive.idx++;const[nr,nc]=sActive.cells[sActive.idx];const ni=sGetInp(nr,nc);if(ni){ni.focus();ni.select();}}}
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){if(sActive&&sActive.idx>0){e.preventDefault();sActive.idx--;const[pr,pc]=sActive.cells[sActive.idx];const pi=sGetInp(pr,pc);if(pi){pi.focus();pi.select();}}}
  else if(e.key==='Escape'){sActive=null;sHighlight();inp.blur();}
}
function solverClear(){if(!confirm('Clear all your answers?'))return;document.querySelectorAll('#s-grid .solve-input').forEach(i=>{i.value='';i.classList.remove('wrong');});sActive=null;sHighlight();}
function sApplyZoom(){const w=document.getElementById('s-zoom-wrap');if(!w)return;w.style.transform='scale('+sCurZoom+')';document.getElementById('s-zoom-val').textContent=Math.round(sCurZoom*100)+'%';const tbl=document.getElementById('s-grid');if(tbl&&tbl.offsetWidth){w.style.width=(tbl.offsetWidth*sCurZoom)+'px';w.style.height=(tbl.offsetHeight*sCurZoom)+'px';}}
function sSetZoom(z){sCurZoom=Math.max(0.25,Math.min(3,z));sApplyZoom();}
function sZoomBy(d){sSetZoom(sCurZoom+d);}
function sZoomFit(){const wrap=document.getElementById('s-grid-wrap');const tbl=document.getElementById('s-grid');if(!wrap||!tbl||!tbl.offsetWidth)return;sSetZoom(Math.min(1,(wrap.clientWidth-20)/tbl.offsetWidth));}

// ── Which puzzle? ─────────────────────────────────────────────────────────────
const sCurPuzzleId = new URLSearchParams(location.search).get('id') || null;
let _checkCount = 0;
let sAlreadyComplete = false;   // finished before this visit, or during it
let _solverStarted = false, _hadUser = false, _authSeen = false, _leaving = false;

function showSolverMessage(html) {
  document.getElementById('solver-title').textContent = 'Arrow Word Puzzles';
  document.getElementById('s-grid').innerHTML = '<tr><td class="solver-msg" style="border:none">' + html + '</td></tr>';
}

// ── Auth state ────────────────────────────────────────────────────────────────
// Signing in happens on the directory page. If nobody is signed in here,
// send the visitor there (it shows the sign-in box and then returns).
function needSignIn() {
  if (_leaving) return;
  const target = 'directory.html?id=' + encodeURIComponent(sCurPuzzleId);
  let lastBounce = 0;
  try { lastBounce = +sessionStorage.getItem('arrowword_solver_bounce') || 0; } catch(e) {}
  if (Date.now() - lastBounce < 15000) {
    // Just came from there — don't ping-pong between the two pages.
    showSolverMessage('Please sign in to solve this puzzle.<br><a href="' + target + '">Go to sign in →</a>');
    return;
  }
  try { sessionStorage.setItem('arrowword_solver_bounce', String(Date.now())); } catch(e) {}
  _leaving = true;
  location.replace(target);
}

if (!sCurPuzzleId) {
  _leaving = true;
  location.replace('directory.html');
} else {
  sbOnUserChanged(user => {
    _authSeen = true;
    const navUser = document.getElementById('nav-user');
    if (user) {
      _hadUser = true;
      navUser.style.display = 'flex';
      document.getElementById('nav-name').textContent = user.user_metadata?.full_name || user.email || '';
      document.getElementById('nav-avatar').src = user.user_metadata?.avatar_url || '';
      if (!_solverStarted) { _solverStarted = true; initSolver(); }
    } else {
      navUser.style.display = 'none';
      if (_hadUser) { _leaving = true; location.href = 'directory.html'; }   // signed out here
      else needSignIn();
    }
  });
  setTimeout(() => {
    if (!_authSeen) showSolverMessage('Could not reach the sign-in service. Please check your connection and <a href="' + location.href.replace(/"/g, '%22') + '">reload the page</a>, or go <a href="directory.html">back to the puzzles</a>.');
  }, 10000);
}

// ── Load puzzle + saved progress ──────────────────────────────────────────────
function readLocal(key) { try { return JSON.parse(localStorage.getItem(key) || '{}') || {}; } catch(e) { return {}; } }
function writeLocal(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch(e) {} }

function collectAnswers() {
  const answers = {};
  document.querySelectorAll('#s-grid input.solve-input').forEach(inp => {
    if (inp.value) answers[inp.dataset.r + ',' + inp.dataset.c] = inp.value;
  });
  return answers;
}

async function initSolver() {
  const id = sCurPuzzleId;
  document.getElementById('solver-title').textContent = 'Loading…';
  try {
    const [entry, prog] = await Promise.all([
      cloudGetPuzzle(id),
      sbLoadProgress(id).catch(() => null)
    ]);
    if (!entry || !entry.data) throw new Error('Puzzle data not found');
    document.getElementById('solver-title').textContent = entry.title;
    document.title = (entry.title || 'Puzzle') + ' — Arrow Word Puzzles';
    buildSolverGrid(entry.data);
    setTimeout(() => { sZoomFit(); fitSolverText(); }, 80);

    // Restore progress — cloud first, unless this device holds a newer save
    let answers = null, cloudSavedAt = 0;
    if (prog) {
      _checkCount = prog.check_count || 0;
      sAlreadyComplete = !!prog.complete;
      if (prog.time_spent_seconds) { _timerSeconds = prog.time_spent_seconds; showTimer(); }
      if (prog.answers && Object.keys(prog.answers).length) answers = prog.answers;
      cloudSavedAt = prog.last_saved ? (Date.parse(prog.last_saved) || 0) : 0;
    }
    const local = readLocal('arrowword_progress')[id];
    if (local && local.answers && !sAlreadyComplete && (!answers || (local.savedAt || 0) > cloudSavedAt)) {
      answers = local.answers;
    }
    if (answers) {
      Object.entries(answers).forEach(([key, val]) => {
        const [r, c] = key.split(',').map(Number);
        const inp = sGetInp(r, c);
        if (inp) inp.value = val;
      });
    }
    _lastSavedAnswers = JSON.stringify(collectAnswers());
    startAutoSave();
  } catch(e) {
    document.getElementById('solver-title').textContent = 'Puzzle';
    document.getElementById('s-grid').innerHTML = `<tr><td style="padding:24px;color:#c00">Could not load: ${escHtml(e.message)}</td></tr>`;
  }
}

// ── Saving ────────────────────────────────────────────────────────────────────
let _autoSaveInterval = null;
let _lastSavedAnswers = '';
let _saveQueue = Promise.resolve();

function queueSave(fn) {
  _saveQueue = _saveQueue.then(fn).catch(e => console.warn('Save failed:', e));
  return _saveQueue;
}

async function flushTime() {
  if (!sbGetUser() || _timerUnsaved <= 0) return;
  const seconds = _timerUnsaved;
  _timerUnsaved = 0;
  await sbSaveTimeSpent(sCurPuzzleId, seconds);
}

// Quiet save: used by the 60-second auto-save and whenever the page is left.
// Never overwrites a completed puzzle with in-progress answers.
function saveNow() {
  if (!_solverStarted || !sWords.length) return Promise.resolve();
  const answers = collectAnswers();
  const snapshot = JSON.stringify(answers);
  const changed = !sAlreadyComplete && snapshot !== _lastSavedAnswers && Object.keys(answers).length > 0;
  if (changed) {
    _lastSavedAnswers = snapshot;
    const local = readLocal('arrowword_progress');
    local[sCurPuzzleId] = { answers, savedAt: Date.now() };
    writeLocal('arrowword_progress', local);
  }
  return queueSave(async () => {
    if (changed && sbGetUser()) await sbSaveProgress(sCurPuzzleId, answers, false, _checkCount);
    await flushTime();
  });
}

function startAutoSave() {
  stopAutoSave();
  _autoSaveInterval = setInterval(saveNow, 60000);
}
function stopAutoSave() {
  clearInterval(_autoSaveInterval);
  _autoSaveInterval = null;
}

// "Save progress" button
async function saveProgress() {
  if (!sWords.length) return;
  const answers = collectAnswers();
  _lastSavedAnswers = JSON.stringify(answers);
  const local = readLocal('arrowword_progress');
  local[sCurPuzzleId] = { answers, savedAt: Date.now() };
  writeLocal('arrowword_progress', local);
  await queueSave(async () => {
    if (sbGetUser()) await sbSaveProgress(sCurPuzzleId, answers, false, _checkCount);
    await flushTime();
  });
  const btn = document.querySelector('.solve-toolbar-left .blue');
  if (btn) { const o = btn.textContent; btn.textContent = '✓ Saved!'; setTimeout(() => btn.textContent = o, 1500); }
  // Force clear highlights on mobile to prevent stuck yellow
  forceResetHighlights();
}

// "Back to puzzles" button — save first, then return to the directory
async function goBack() {
  if (_leaving) return;
  _leaving = true;
  const btn = document.getElementById('solver-back');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  try {
    await Promise.race([saveNow(), new Promise(resolve => setTimeout(resolve, 4000))]);
  } catch(e) {}
  stopTimer(); stopAutoSave();
  location.href = 'directory.html';
}

// Leaving any other way (browser Back, closing the tab, switching apps)
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveNow(); });
window.addEventListener('pagehide', () => { saveNow(); });

// ── Completion + checking ─────────────────────────────────────────────────────
async function sMaybeCelebrate(){
  // Check every word is fully and correctly filled — works for all grid sizes
  if(!sWords.length)return;
  for(let wi=0;wi<sWords.length;wi++){
    const w=sWords[wi];
    for(let ci=0;ci<w.cells.length;ci++){
      const [r,col]=w.cells[ci];
      const inp=sGetInp(r,col);
      if(!inp||(inp.value||'').toUpperCase()!==w.ans[ci])return;
    }
  }
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  sActive=null;sHighlight();
  stopTimer(); stopAutoSave();
  // Save completion
  const answers=collectAnswers();
  sAlreadyComplete=true;
  _lastSavedAnswers=JSON.stringify(answers);
  const complete=readLocal('arrowword_complete');
  complete[sCurPuzzleId]=Date.now();
  writeLocal('arrowword_complete',complete);
  const prog=readLocal('arrowword_progress');
  delete prog[sCurPuzzleId];
  writeLocal('arrowword_progress',prog);
  if(sbGetUser()){
    await queueSave(async()=>{
      await sbSaveProgress(sCurPuzzleId,answers,true,_checkCount);
      await flushTime();
    });
  }
  showRatingModal();
}
async function solverCheck(){
  let wrong=0,filled=0;
  document.querySelectorAll('#s-grid td.t-answer input').forEach(inp=>{
    const r=+inp.dataset.r,c=+inp.dataset.c;
    const got=(inp.value||'').toUpperCase();if(!got){inp.classList.remove('wrong');return;}filled++;
    const w=sWords.find(x=>x.cells.some(([a,b])=>a===r&&b===c));if(!w)return;
    const idx=w.cells.findIndex(([a,b])=>a===r&&b===c);
    if(got!==w.ans[idx]){inp.classList.add('wrong');wrong++;}else inp.classList.remove('wrong');
  });
  sActive=null;sHighlight();
  // Track check count
  _checkCount++;
  if(sbGetUser()) await sbIncrementCheckCount(sCurPuzzleId);
  if(!filled)alert('No letters typed yet.');
  else alert(`${filled-wrong} correct, ${wrong} wrong (out of ${filled} typed).`);
  // Force clear on mobile
  forceResetHighlights();
}

// ── Timer ─────────────────────────────────────────────────────────────────────
let _timerInterval = null;
let _timerSeconds = 0;     // total shown on screen (includes earlier visits)
let _timerUnsaved = 0;     // seconds from this visit not yet saved to the cloud
let _timerStarted = false;

function showTimer() {
  const m = Math.floor(_timerSeconds / 60);
  const s = _timerSeconds % 60;
  const el = document.getElementById('solver-timer');
  if (el) el.textContent = m + ':' + String(s).padStart(2,'0');
}

function startTimer() {
  if (_timerStarted) return;
  _timerStarted = true;
  _timerInterval = setInterval(() => {
    _timerSeconds++;
    _timerUnsaved++;
    showTimer();
  }, 1000);
}

function stopTimer() {
  clearInterval(_timerInterval);
  _timerInterval = null;
}

// ── Ratings ───────────────────────────────────────────────────────────────────
let _selectedRating = 0;

function setStar(v) {
  _selectedRating = v;
  document.querySelectorAll('.star').forEach(s => {
    s.classList.toggle('active', +s.dataset.v <= v);
  });
}

async function submitCompletionRating() {
  if (!_selectedRating) { alert('Please select a star rating.'); return; }

  const comment = (document.getElementById('completion-comment').value || '').trim();

  if (sbGetUser() && sCurPuzzleId) {
    await sbSaveRating(sCurPuzzleId, _selectedRating);

    // Save as 'rating_feedback' type (separate from general feedback)
    if (comment) {
      await sbSaveComment(sCurPuzzleId, comment, 'rating_feedback');
    }
  }
  closeCompletionModal();
}

function closeCompletionModal() {
  document.getElementById('rating-modal').classList.remove('open');
  document.getElementById('completion-comment').value = '';
  _selectedRating = 0;
  document.querySelectorAll('.star').forEach(s => s.classList.remove('active'));
  document.getElementById('celebration').style.display = 'none';
}

function showRatingModal() {
  if (!sbGetUser()) return;
  document.getElementById('completion-title').textContent = 'Puzzle Complete! 🎉';
  document.getElementById('completion-msg').textContent = 'Congratulations! Please rate your experience.';
  document.getElementById('celebration').style.display = 'block';
  setStar(5); // Set default to 5 stars
  document.getElementById('rating-modal').classList.add('open');
}

// ── Comment/Bug Report ────────────────────────────────────────────────────────
function openCommentModal() {
  document.getElementById('comment-report-modal').classList.add('open');
  document.getElementById('comment-text').value = '';
  document.querySelector('input[name="comment-type"][value="feedback"]').checked = true;
}

function closeCommentModal() {
  document.getElementById('comment-report-modal').classList.remove('open');
}

async function submitCommentReport() {
  const comment = (document.getElementById('comment-text').value || '').trim();
  const type = document.querySelector('input[name="comment-type"]:checked').value;

  if (!comment) {
    alert('Please enter a comment.');
    return;
  }

  if (!sbGetUser()) {
    alert('Please sign in to submit feedback.');
    return;
  }

  try {
    const success = await sbSaveComment(sCurPuzzleId, comment, type);
    if (success) {
      alert('Thank you! Your feedback has been recorded.');
      closeCommentModal();
    } else {
      alert('Failed to save comment. Please try again.');
    }
  } catch (e) {
    console.error('Comment submission error:', e);
    alert('Error: ' + (e.message || 'Failed to save comment'));
  }
}

</script>

<div class="rating-modal" id="rating-modal">
  <div class="rating-box">
    <div class="celebration" id="celebration">🎉</div>
    <h2 id="completion-title">Rate this puzzle</h2>
    <p id="completion-msg">How did you find it? Your feedback helps improve future puzzles.</p>
    <div class="stars" id="stars">
      <span class="star" data-v="1" onclick="setStar(1)">★</span>
      <span class="star" data-v="2" onclick="setStar(2)">★</span>
      <span class="star" data-v="3" onclick="setStar(3)">★</span>
      <span class="star" data-v="4" onclick="setStar(4)">★</span>
      <span class="star" data-v="5" onclick="setStar(5)">★</span>
    </div>
    <div class="comment-section">
      <label for="completion-comment">Optional feedback or comments:</label>
      <textarea id="completion-comment" placeholder="Any feedback? We'd love to hear from you..."></textarea>
      <p class="comment-hint">Your feedback helps us improve future puzzles.</p>
    </div>
    <div>
      <button class="btn-rate" onclick="submitCompletionRating()">Submit rating</button>
    </div>
  </div>
</div>

<!-- Comment/Bug Report Modal -->
<div class="comment-report-modal" id="comment-report-modal">
  <div class="comment-report-box">
    <h2>Send Feedback</h2>
    
    <div class="comment-type-select">
      <label><input type="radio" name="comment-type" value="feedback" checked> General feedback</label>
      <label><input type="radio" name="comment-type" value="bug_report"> Report a bug</label>
    </div>

    <textarea id="comment-text" placeholder="Tell us what you think..."></textarea>

    <div class="comment-buttons">
      <button class="btn-submit-comment" onclick="submitCommentReport()">Send</button>
      <button class="btn-cancel-comment" onclick="closeCommentModal()">Cancel</button>
    </div>
  </div>
</div>
</body>
</html>
