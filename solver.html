<script>
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// The code that DRAWS the grid (arrows, word layout, squares, clue boxes,
// printing) lives in grid-core.js — the very same code the builder uses.
// This page only adds what solving needs: typing, checking, saving, the timer.
if(!window.ArrowGrid){alert('The file grid-core.js could not be loaded, so the puzzle cannot be shown.\n\nPlease reload the page.');}

// ── Solver grid ───────────────────────────────────────────────────────────────
let sWords = [], sActive = null, sCurZoom = 1;
let sPrintGrid = null, sPrintRows = 0, sPrintCols = 0, sPrintCellSizePx = 64, sPrintTextSizePx = 12;

function gridWrapClick(e) {
  if (e.target.closest('td.t-empty') || e.target.closest('td.t-black') || e.target === document.getElementById('s-grid-wrap') || e.target === document.getElementById('s-zoom-wrap')) {
    sActive = null; sHighlight();
  }
}

function forceResetHighlights(){
  document.querySelectorAll('#s-grid input').forEach(inp => { inp.style.background = ''; });
  document.querySelectorAll('.clue-slot.active-clue').forEach(e => e.classList.remove('active-clue'));
  sActive = null;
}

function buildSolverGrid(data) {
  const rows=data.rows,cols=data.cols,cSz=data.cellSizePx||64,tSz=data.textSizePx||12;
  sWords=[];sActive=null;
  // Same grid model and same squares as the builder draws.
  const grid=ArrowGrid.gridFromData(data);
  data.cells.forEach(cell=>{
    if(cell.t!=='clue')return;
    cell.clues.forEach((cl,ci)=>{
      const wcells=ArrowGrid.getWordCells(cl.dir,cl.ans,cell.r,cell.c).filter(([ar,ac])=>ar>=0&&ar<rows&&ac>=0&&ac<cols);
      sWords.push({or:cell.r,oc:cell.c,ci,cells:wcells,ans:cl.ans});
    });
  });
  sPrintGrid=grid;sPrintRows=rows;sPrintCols=cols;sPrintCellSizePx=cSz;sPrintTextSizePx=tSz;
  const tbl=document.getElementById('s-grid');tbl.innerHTML='';
  for(let r=0;r<rows;r++){
    const tr=document.createElement('tr');
    for(let c=0;c<cols;c++){
      const td=ArrowGrid.buildCell({r,c,grid,cellSizePx:cSz,textSizePx:tSz,solve:true});
      // Solving behaviour: click a clue to start its word, type into squares.
      td.querySelectorAll('.clue-slot').forEach((slot,idx)=>{
        slot.dataset.or=r;slot.dataset.oc=c;slot.dataset.ci=idx;
        slot.addEventListener('click',e=>{e.stopPropagation();sPickClue(r,c,idx);});
      });
      const inp=td.querySelector('input.solve-input');
      if(inp){
        inp.setAttribute('autocapitalize','characters');inp.setAttribute('autocomplete','off');inp.setAttribute('autocorrect','off');inp.setAttribute('spellcheck','false');
        inp.addEventListener('input',e=>{startTimer();sSolveInput(e);});inp.addEventListener('keydown',sSolveKeydown);inp.addEventListener('focus',e=>{startTimer();sSolveFocus(e);});
      }
      tr.appendChild(td);
    }
    tbl.appendChild(tr);
  }
}

// The print layout is drawn by grid-core.js (shared with the builder).
// The solver prints the blank puzzle only, without the answers page.
function printSolverPuzzle(){
  if(!sPrintGrid||!sPrintGrid.length||!sPrintRows||!sPrintCols){alert('There is no puzzle grid to print yet.');return;}
  ArrowGrid.printPuzzle({
    grid:sPrintGrid,rows:sPrintRows,cols:sPrintCols,
    cellSizePx:sPrintCellSizePx,textSizePx:sPrintTextSizePx,
    title:document.getElementById('solver-title').textContent,
    answerPage:false,
    screenTable:document.getElementById('s-grid')
  });
}

function sGetInp(r,c){return document.querySelector('#s-grid input.solve-input[data-r="'+r+'"][data-c="'+c+'"]');}
function sPickClue(or,oc,ci){const w=sWords.find(x=>x.or===or&&x.oc===oc&&x.ci===ci);if(!w)return;sActive={or,oc,ci,cells:w.cells,ans:w.ans,idx:0};sHighlight();const inp=sGetInp(w.cells[0][0],w.cells[0][1]);if(inp){inp.focus();inp.select();}}
function sHighlight(){
  document.querySelectorAll('#s-grid .solve-input').forEach(i=>i.classList.remove('in-active-word','active-cell'));
  document.querySelectorAll('#s-grid .clue-slot').forEach(s=>s.classList.remove('active-clue'));
  if(!sActive)return;
  sActive.cells.forEach(([r,c],i)=>{const inp=sGetInp(r,c);if(inp){inp.classList.add('in-active-word');if(i===sActive.idx)inp.classList.add('active-cell');}});
  const slot=document.querySelector('#s-grid .clue-slot[data-or="'+sActive.or+'"][data-oc="'+sActive.oc+'"][data-ci="'+sActive.ci+'"]');
  if(slot)slot.classList.add('active-clue');
}
function sSolveFocus(e){
  const inp=e.target;inp.classList.remove('wrong');
  const r=+inp.dataset.r,c=+inp.dataset.c;
  if(sActive){const i=sActive.cells.findIndex(([a,b])=>a===r&&b===c);if(i>=0){sActive.idx=i;sHighlight();return;}}
  const w=sWords.find(x=>x.cells.some(([a,b])=>a===r&&b===c));
  if(w){sActive={or:w.or,oc:w.oc,ci:w.ci,cells:w.cells,ans:w.ans,idx:w.cells.findIndex(([a,b])=>a===r&&b===c)};if(sActive.idx<0)sActive.idx=0;sHighlight();}
}
function sSolveInput(e){
  const inp=e.target;inp.value=(inp.value||'').slice(-1).toUpperCase().replace(/[^A-Z]/,'');inp.classList.remove('wrong');
  if(inp.value&&sActive){const next=sActive.idx+1;if(next<sActive.cells.length){sActive.idx=next;const[nr,nc]=sActive.cells[next];const ni=sGetInp(nr,nc);if(ni){ni.focus();ni.select();}}else sHighlight();}
  sMaybeCelebrate();
}
function sSolveKeydown(e){
  const inp=e.target;
  if(e.key==='Backspace'){if(inp.value)return;if(sActive&&sActive.idx>0){e.preventDefault();sActive.idx--;const[pr,pc]=sActive.cells[sActive.idx];const pi=sGetInp(pr,pc);if(pi){pi.value='';pi.classList.remove('wrong');pi.focus();pi.select();}}}
  else if(e.key==='ArrowRight'||e.key==='ArrowDown'){if(sActive&&sActive.idx<sActive.cells.length-1){e.preventDefault();sActive.idx++;const[nr,nc]=sActive.cells[sActive.idx];const ni=sGetInp(nr,nc);if(ni){ni.focus();ni.select();}}}
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){if(sActive&&sActive.idx>0){e.preventDefault();sActive.idx--;const[pr,pc]=sActive.cells[sActive.idx];const pi=sGetInp(pr,pc);if(pi){pi.focus();pi.select();}}}
  else if(e.key==='Escape'){sActive=null;sHighlight();inp.blur();}
}
function solverClear(){if(!confirm('Clear all your answers?'))return;document.querySelectorAll('#s-grid .solve-input').forEach(i=>{i.value='';i.classList.remove('wrong');});sActive=null;sHighlight();}
function sApplyZoom(){const w=document.getElementById('s-zoom-wrap');if(!w)return;w.style.transform='scale('+sCurZoom+')';document.getElementById('s-zoom-val').textContent=Math.round(sCurZoom*100)+'%';const tbl=document.getElementById('s-grid');if(tbl&&tbl.offsetWidth){w.style.width=(tbl.offsetWidth*sCurZoom)+'px';w.style.height=(tbl.offsetHeight*sCurZoom)+'px';}}
function sSetZoom(z){sCurZoom=Math.max(0.25,Math.min(3,z));sApplyZoom();}
function sZoomBy(d){sSetZoom(sCurZoom+d);}
function sZoomFit(){const wrap=document.getElementById('s-grid-wrap');const tbl=document.getElementById('s-grid');if(!wrap||!tbl||!tbl.offsetWidth)return;sSetZoom(Math.min(1,(wrap.clientWidth-20)/tbl.offsetWidth));}

// ── Which puzzle? ─────────────────────────────────────────────────────────────
const sCurPuzzleId = new URLSearchParams(location.search).get('id') || null;
let _checkCount = 0;
let sAlreadyComplete = false;   // finished before this visit, or during it
let _solverStarted = false, _hadUser = false, _authSeen = false, _leaving = false;

function showSolverMessage(html) {
  document.getElementById('solver-title').textContent = 'Arrow Word Puzzles';
  document.getElementById('s-grid').innerHTML = '<tr><td class="solver-msg" style="border:none">' + html + '</td></tr>';
}

// ── Auth state ────────────────────────────────────────────────────────────────
// Signing in happens on the directory page. If nobody is signed in here,
// send the visitor there (it shows the sign-in box and then returns).
function needSignIn() {
  if (_leaving) return;
  const target = 'directory.html?id=' + encodeURIComponent(sCurPuzzleId);
  let lastBounce = 0;
  try { lastBounce = +sessionStorage.getItem('arrowword_solver_bounce') || 0; } catch(e) {}
  if (Date.now() - lastBounce < 15000) {
    // Just came from there — don't ping-pong between the two pages.
    showSolverMessage('Please sign in to solve this puzzle.<br><a href="' + target + '">Go to sign in →</a>');
    return;
  }
  try { sessionStorage.setItem('arrowword_solver_bounce', String(Date.now())); } catch(e) {}
  _leaving = true;
  location.replace(target);
}

if (!sCurPuzzleId) {
  _leaving = true;
  location.replace('directory.html');
} else {
  sbOnUserChanged(user => {
    _authSeen = true;
    const navUser = document.getElementById('nav-user');
    if (user) {
      _hadUser = true;
      navUser.style.display = 'flex';
      document.getElementById('nav-name').textContent = user.user_metadata?.full_name || user.email || '';
      document.getElementById('nav-avatar').src = user.user_metadata?.avatar_url || '';
      if (!_solverStarted) { _solverStarted = true; initSolver(); }
    } else {
      navUser.style.display = 'none';
      if (_hadUser) { _leaving = true; location.href = 'directory.html'; }   // signed out here
      else needSignIn();
    }
  });
  setTimeout(() => {
    if (!_authSeen) showSolverMessage('Could not reach the sign-in service. Please check your connection and <a href="' + location.href.replace(/"/g, '%22') + '">reload the page</a>, or go <a href="directory.html">back to the puzzles</a>.');
  }, 10000);
}

// ── Load puzzle + saved progress ──────────────────────────────────────────────
function readLocal(key) { try { return JSON.parse(localStorage.getItem(key) || '{}') || {}; } catch(e) { return {}; } }
function writeLocal(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch(e) {} }

function collectAnswers() {
  const answers = {};
  document.querySelectorAll('#s-grid input.solve-input').forEach(inp => {
    if (inp.value) answers[inp.dataset.r + ',' + inp.dataset.c] = inp.value;
  });
  return answers;
}

async function initSolver() {
  const id = sCurPuzzleId;
  document.getElementById('solver-title').textContent = 'Loading…';
  try {
    const [entry, prog] = await Promise.all([
      cloudGetPuzzle(id),
      sbLoadProgress(id).catch(() => null)
    ]);
    if (!entry || !entry.data) throw new Error('Puzzle data not found');
    document.getElementById('solver-title').textContent = entry.title;
    document.title = (entry.title || 'Puzzle') + ' — Arrow Word Puzzles';
    buildSolverGrid(entry.data);
    setTimeout(() => { sZoomFit(); }, 80);

    // Restore progress — cloud first, unless this device holds a newer save
    let answers = null, cloudSavedAt = 0;
    if (prog) {
      _checkCount = prog.check_count || 0;
      sAlreadyComplete = !!prog.complete;
      if (prog.time_spent_seconds) { _timerSeconds = prog.time_spent_seconds; showTimer(); }
      if (prog.answers && Object.keys(prog.answers).length) answers = prog.answers;
      cloudSavedAt = prog.last_saved ? (Date.parse(prog.last_saved) || 0) : 0;
    }
    const local = readLocal('arrowword_progress')[id];
    if (local && local.answers && !sAlreadyComplete && (!answers || (local.savedAt || 0) > cloudSavedAt)) {
      answers = local.answers;
    }
    if (answers) {
      Object.entries(answers).forEach(([key, val]) => {
        const [r, c] = key.split(',').map(Number);
        const inp = sGetInp(r, c);
        if (inp) inp.value = val;
      });
    }
    _lastSavedAnswers = JSON.stringify(collectAnswers());
    startAutoSave();
  } catch(e) {
    document.getElementById('solver-title').textContent = 'Puzzle';
    document.getElementById('s-grid').innerHTML = `<tr><td style="padding:24px;color:#c00">Could not load: ${escHtml(e.message)}</td></tr>`;
  }
}

// ── Saving ────────────────────────────────────────────────────────────────────
let _autoSaveInterval = null;
let _lastSavedAnswers = '';
let _saveQueue = Promise.resolve();

function queueSave(fn) {
  _saveQueue = _saveQueue.then(fn).catch(e => console.warn('Save failed:', e));
  return _saveQueue;
}

async function flushTime() {
  if (!sbGetUser() || _timerUnsaved <= 0) return;
  const seconds = _timerUnsaved;
  _timerUnsaved = 0;
  await sbSaveTimeSpent(sCurPuzzleId, seconds);
}

// Quiet save: used by the 60-second auto-save and whenever the page is left.
// Never overwrites a completed puzzle with in-progress answers.
function saveNow() {
  if (!_solverStarted || !sWords.length) return Promise.resolve();
  const answers = collectAnswers();
  const snapshot = JSON.stringify(answers);
  const changed = !sAlreadyComplete && snapshot !== _lastSavedAnswers && Object.keys(answers).length > 0;
  if (changed) {
    _lastSavedAnswers = snapshot;
    const local = readLocal('arrowword_progress');
    local[sCurPuzzleId] = { answers, savedAt: Date.now() };
    writeLocal('arrowword_progress', local);
  }
  return queueSave(async () => {
    if (changed && sbGetUser()) await sbSaveProgress(sCurPuzzleId, answers, false, _checkCount);
    await flushTime();
  });
}

function startAutoSave() {
  stopAutoSave();
  _autoSaveInterval = setInterval(saveNow, 60000);
}
function stopAutoSave() {
  clearInterval(_autoSaveInterval);
  _autoSaveInterval = null;
}

// "Save progress" button
async function saveProgress() {
  if (!sWords.length) return;
  const answers = collectAnswers();
  _lastSavedAnswers = JSON.stringify(answers);
  const local = readLocal('arrowword_progress');
  local[sCurPuzzleId] = { answers, savedAt: Date.now() };
  writeLocal('arrowword_progress', local);
  await queueSave(async () => {
    if (sbGetUser()) await sbSaveProgress(sCurPuzzleId, answers, false, _checkCount);
    await flushTime();
  });
  const btn = document.querySelector('.solve-toolbar-left .blue');
  if (btn) { const o = btn.textContent; btn.textContent = '✓ Saved!'; setTimeout(() => btn.textContent = o, 1500); }
  // Force clear highlights on mobile to prevent stuck yellow
  forceResetHighlights();
}

// "Back to puzzles" button — save first, then return to the directory
async function goBack() {
  if (_leaving) return;
  _leaving = true;
  const btn = document.getElementById('solver-back');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  try {
    await Promise.race([saveNow(), new Promise(resolve => setTimeout(resolve, 4000))]);
  } catch(e) {}
  stopTimer(); stopAutoSave();
  location.href = 'directory.html';
}

// Leaving any other way (browser Back, closing the tab, switching apps)
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveNow(); });
window.addEventListener('pagehide', () => { saveNow(); });

// ── Completion + checking ─────────────────────────────────────────────────────
async function sMaybeCelebrate(){
  // Check every word is fully and correctly filled — works for all grid sizes
  if(!sWords.length)return;
  for(let wi=0;wi<sWords.length;wi++){
    const w=sWords[wi];
    for(let ci=0;ci<w.cells.length;ci++){
      const [r,col]=w.cells[ci];
      const inp=sGetInp(r,col);
      if(!inp||(inp.value||'').toUpperCase()!==w.ans[ci])return;
    }
  }
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  sActive=null;sHighlight();
  stopTimer(); stopAutoSave();
  // Save completion
  const answers=collectAnswers();
  sAlreadyComplete=true;
  _lastSavedAnswers=JSON.stringify(answers);
  const complete=readLocal('arrowword_complete');
  complete[sCurPuzzleId]=Date.now();
  writeLocal('arrowword_complete',complete);
  const prog=readLocal('arrowword_progress');
  delete prog[sCurPuzzleId];
  writeLocal('arrowword_progress',prog);
  if(sbGetUser()){
    await queueSave(async()=>{
      await sbSaveProgress(sCurPuzzleId,answers,true,_checkCount);
      await flushTime();
    });
  }
  showRatingModal();
}
async function solverCheck(){
  let wrong=0,filled=0;
  document.querySelectorAll('#s-grid td.t-answer input').forEach(inp=>{
    const r=+inp.dataset.r,c=+inp.dataset.c;
    const got=(inp.value||'').toUpperCase();if(!got){inp.classList.remove('wrong');return;}filled++;
    const w=sWords.find(x=>x.cells.some(([a,b])=>a===r&&b===c));if(!w)return;
    const idx=w.cells.findIndex(([a,b])=>a===r&&b===c);
    if(got!==w.ans[idx]){inp.classList.add('wrong');wrong++;}else inp.classList.remove('wrong');
  });
  sActive=null;sHighlight();
  // Track check count
  _checkCount++;
  if(sbGetUser()) await sbIncrementCheckCount(sCurPuzzleId);
  if(!filled)alert('No letters typed yet.');
  else alert(`${filled-wrong} correct, ${wrong} wrong (out of ${filled} typed).`);
  // Force clear on mobile
  forceResetHighlights();
}

// ── Timer ─────────────────────────────────────────────────────────────────────
let _timerInterval = null;
let _timerSeconds = 0;     // total shown on screen (includes earlier visits)
let _timerUnsaved = 0;     // seconds from this visit not yet saved to the cloud
let _timerStarted = false;

function showTimer() {
  const m = Math.floor(_timerSeconds / 60);
  const s = _timerSeconds % 60;
  const el = document.getElementById('solver-timer');
  if (el) el.textContent = m + ':' + String(s).padStart(2,'0');
}

function startTimer() {
  if (_timerStarted) return;
  _timerStarted = true;
  _timerInterval = setInterval(() => {
    _timerSeconds++;
    _timerUnsaved++;
    showTimer();
  }, 1000);
}

function stopTimer() {
  clearInterval(_timerInterval);
  _timerInterval = null;
}

// ── Ratings ───────────────────────────────────────────────────────────────────
let _selectedRating = 0;

function setStar(v) {
  _selectedRating = v;
  document.querySelectorAll('.star').forEach(s => {
    s.classList.toggle('active', +s.dataset.v <= v);
  });
}

async function submitCompletionRating() {
  if (!_selectedRating) { alert('Please select a star rating.'); return; }

  const comment = (document.getElementById('completion-comment').value || '').trim();

  if (sbGetUser() && sCurPuzzleId) {
    await sbSaveRating(sCurPuzzleId, _selectedRating);

    // Save as 'rating_feedback' type (separate from general feedback)
    if (comment) {
      await sbSaveComment(sCurPuzzleId, comment, 'rating_feedback');
    }
  }
  closeCompletionModal();
}

function closeCompletionModal() {
  document.getElementById('rating-modal').classList.remove('open');
  document.getElementById('completion-comment').value = '';
  _selectedRating = 0;
  document.querySelectorAll('.star').forEach(s => s.classList.remove('active'));
  document.getElementById('celebration').style.display = 'none';
}

function showRatingModal() {
  if (!sbGetUser()) return;
  document.getElementById('completion-title').textContent = 'Puzzle Complete! 🎉';
  document.getElementById('completion-msg').textContent = 'Congratulations! Please rate your experience.';
  document.getElementById('celebration').style.display = 'block';
  setStar(5); // Set default to 5 stars
  document.getElementById('rating-modal').classList.add('open');
}

// ── Comment/Bug Report ────────────────────────────────────────────────────────
function openCommentModal() {
  document.getElementById('comment-report-modal').classList.add('open');
  document.getElementById('comment-text').value = '';
  document.querySelector('input[name="comment-type"][value="feedback"]').checked = true;
}

function closeCommentModal() {
  document.getElementById('comment-report-modal').classList.remove('open');
}

async function submitCommentReport() {
  const comment = (document.getElementById('comment-text').value || '').trim();
  const type = document.querySelector('input[name="comment-type"]:checked').value;

  if (!comment) {
    alert('Please enter a comment.');
    return;
  }

  if (!sbGetUser()) {
    alert('Please sign in to submit feedback.');
    return;
  }

  try {
    const success = await sbSaveComment(sCurPuzzleId, comment, type);
    if (success) {
      alert('Thank you! Your feedback has been recorded.');
      closeCommentModal();
    } else {
      alert('Failed to save comment. Please try again.');
    }
  } catch (e) {
    console.error('Comment submission error:', e);
    alert('Error: ' + (e.message || 'Failed to save comment'));
  }
}

</script>

<div class="rating-modal" id="rating-modal">
  <div class="rating-box">
    <div class="celebration" id="celebration">🎉</div>
    <h2 id="completion-title">Rate this puzzle</h2>
    <p id="completion-msg">How did you find it? Your feedback helps improve future puzzles.</p>
    <div class="stars" id="stars">
      <span class="star" data-v="1" onclick="setStar(1)">★</span>
      <span class="star" data-v="2" onclick="setStar(2)">★</span>
      <span class="star" data-v="3" onclick="setStar(3)">★</span>
      <span class="star" data-v="4" onclick="setStar(4)">★</span>
      <span class="star" data-v="5" onclick="setStar(5)">★</span>
    </div>
    <div class="comment-section">
      <label for="completion-comment">Optional feedback or comments:</label>
      <textarea id="completion-comment" placeholder="Any feedback? We'd love to hear from you..."></textarea>
      <p class="comment-hint">Your feedback helps us improve future puzzles.</p>
    </div>
    <div>
      <button class="btn-rate" onclick="submitCompletionRating()">Submit rating</button>
    </div>
  </div>
</div>

<!-- Comment/Bug Report Modal -->
<div class="comment-report-modal" id="comment-report-modal">
  <div class="comment-report-box">
    <h2>Send Feedback</h2>
    
    <div class="comment-type-select">
      <label><input type="radio" name="comment-type" value="feedback" checked> General feedback</label>
      <label><input type="radio" name="comment-type" value="bug_report"> Report a bug</label>
    </div>

    <textarea id="comment-text" placeholder="Tell us what you think..."></textarea>

    <div class="comment-buttons">
      <button class="btn-submit-comment" onclick="submitCommentReport()">Send</button>
      <button class="btn-cancel-comment" onclick="closeCommentModal()">Cancel</button>
    </div>
  </div>
</div>
</body>
