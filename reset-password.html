<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<title>Set a New Password — Arrow Word Puzzles</title>
<meta name="aw-version" content="v36">
<script src="site-banner.js?v=33"></script>
<!--
  Arrow Word Puzzles — Set a new password
  CURRENT VERSION: v36
  CHANGELOG:
  v36 - First version. Opened from the link in a "forgot password" email; lets
        the person choose a new password for their email account.
-->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f0ff;color:#222;min-height:100vh}
nav{background:#7744bb;color:#fff;padding:12px 24px;display:flex;align-items:center;justify-content:space-between}
.nav-brand{font-size:20px;font-weight:700;text-decoration:none;color:#fff}
.nav-brand span{color:#e8d8ff}
main{max-width:460px;margin:48px auto;padding:0 16px}
.card{background:#fff;border:1px solid #e0d8f0;border-radius:12px;padding:28px}
h1{font-size:22px;font-weight:700;color:#443366;margin-bottom:10px;text-align:center}
p{font-size:14px;line-height:1.6;color:#555;margin-bottom:14px}
label{display:block;font-size:12px;color:#666;margin:10px 0 4px}
input{width:100%;padding:10px 12px;font-size:15px;border:1px solid #ccc;border-radius:7px}
input:focus{outline:none;border-color:#7744bb;box-shadow:0 0 0 2px rgba(119,68,187,.12)}
.go{width:100%;margin-top:14px;background:#7744bb;color:#fff;border:none;border-radius:7px;padding:11px;font-size:15px;font-weight:600;cursor:pointer}
.go:disabled{opacity:.6;cursor:default}
.msg{margin-top:12px;font-size:14px;line-height:1.5}
.msg.bad{color:#b00020}.msg.good{color:#155724}
a{color:#7744bb;font-weight:600}
.hidden{display:none}
</style>
</head>
<body>
<nav>
  <a class="nav-brand" href="index.html">Arrow<span>Word</span></a>
  <a href="directory.html" style="color:#e8d8ff;font-size:13px;text-decoration:none">Puzzles →</a>
</nav>
<main>
  <div class="card">
    <h1>Set a new password</h1>

    <div id="checking"><p style="text-align:center">Checking your reset link…</p></div>

    <form id="new-pw" class="hidden" novalidate>
      <p>Signed in as <strong id="who"></strong>. Choose a new password.</p>
      <label for="pw1">New password (at least 8 characters)</label>
      <input type="password" id="pw1" autocomplete="new-password">
      <label for="pw2">Type it again</label>
      <input type="password" id="pw2" autocomplete="new-password">
      <button type="submit" class="go" id="save">Save new password</button>
      <div class="msg" id="msg" role="status"></div>
    </form>

    <div id="done" class="hidden">
      <p class="msg good" style="text-align:center">✓ Your password has been changed and you are signed in.</p>
      <p style="text-align:center"><a href="directory.html">Go to the puzzles →</a></p>
    </div>

    <div id="no-link" class="hidden">
      <p id="no-link-text">This page works from the link in a "forgot password" email. Enter your email below and we'll send you a new link.</p>
      <div id="request"></div>
    </div>
  </div>
</main>

<script src="supabase-auth.js?v=36"></script>
<script>
const show = id => ['checking', 'new-pw', 'done', 'no-link'].forEach(x => document.getElementById(x).classList.toggle('hidden', x !== id));
const linkError = /error_code=|error=/.test(location.hash + location.search);
let decided = false, requestForm = null;

function askForNewLink(text) {
  if (decided) return; decided = true;
  if (text) document.getElementById('no-link-text').textContent = text;
  if (!requestForm) { requestForm = sbMountEmailForm(document.getElementById('request')); requestForm.setMode('forgot'); }
  show('no-link');
}
function offerNewPassword(user) {
  if (decided) return; decided = true;
  document.getElementById('who').textContent = user.email || 'your account';
  show('new-pw');
  document.getElementById('pw1').focus();
}

// The reset link signs the person in for this purpose ('PASSWORD_RECOVERY').
sbOnAuthEvent((event, user) => { if (event === 'PASSWORD_RECOVERY' && user) offerNewPassword(user); });
sbOnUserChanged(user => {
  if (decided) return;
  if (linkError) return askForNewLink('That reset link has expired or was already used. Enter your email below and we\'ll send you a new one.');
  // Give the sign-in service a moment to read the link before deciding.
  setTimeout(() => { const u = sbGetUser(); if (u) offerNewPassword(u); else askForNewLink(); }, 800);
});
setTimeout(() => { if (!decided) askForNewLink('The sign-in service could not be reached. Please check your connection, or request a new link below.'); }, 10000);

document.getElementById('new-pw').addEventListener('submit', async e => {
  e.preventDefault();
  const a = document.getElementById('pw1').value, b = document.getElementById('pw2').value, msg = document.getElementById('msg');
  const say = (t, k) => { msg.textContent = t; msg.className = 'msg ' + (k || ''); };
  if (a.length < 8) return say('Please choose a password of at least 8 characters.', 'bad');
  if (a !== b) return say('The two passwords are not the same.', 'bad');
  const btn = document.getElementById('save'); btn.disabled = true; btn.textContent = 'Saving…';
  const r = await sbUpdatePassword(a);
  btn.disabled = false; btn.textContent = 'Save new password';
  if (!r.ok) return say(r.error, 'bad');
  show('done');
});
</script>
</body>
</html>
